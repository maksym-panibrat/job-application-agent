name: validate-catalog

on:
  schedule:
    - cron: "0 7 * * *"  # 07:00 UTC daily
  workflow_dispatch: {}

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --dev
      - name: Reconcile moved or removed ATS boards
        run: |
          uv run python -m app.services.catalog_reconciliation \
            --write \
            --report catalog-reconciliation.json
      - name: Summarize reconciliation
        if: always()
        run: |
          {
            echo '## Catalog reconciliation'
            echo
            if [ -f catalog-reconciliation.json ]; then
              echo '```json'
              cat catalog-reconciliation.json
              echo '```'
            else
              echo 'No report was produced; inspect the failed reconciliation step.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload reconciliation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: catalog-reconciliation
          path: catalog-reconciliation.json
          if-no-files-found: warn
      - name: Create or update repair PR
        if: success()
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          add-paths: app/data/catalog/companies.yaml
          branch: automation/prune-invalid-catalog
          delete-branch: true
          commit-message: "chore: prune moved ATS boards from catalog"
          title: "chore: prune moved ATS boards from catalog"
          body: |
            Automated catalog reconciliation removed provider slugs only after a
            confirmed missing-board response. Transient provider/network errors
            are retained and reported in the workflow artifact, never removed.

            Review the diff for a replacement ATS slug before merging.
          labels: catalog-validation
